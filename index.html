<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分子生物學複習字卡</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.6rem;
    color: #2d3748;
    margin-bottom: 8px;
    text-align: center;
  }

  .subtitle {
    color: #718096;
    font-size: 0.9rem;
    margin-bottom: 24px;
    text-align: center;
  }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .filter-btn {
    padding: 6px 14px;
    border: 2px solid #cbd5e0;
    background: white;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.82rem;
    color: #4a5568;
    transition: all 0.2s;
  }

  .filter-btn.active, .filter-btn:hover {
    background: #4299e1;
    border-color: #4299e1;
    color: white;
  }

  /* ── Progress ── */
  .progress-bar-wrap {
    width: 100%;
    max-width: 800px;
    background: #e2e8f0;
    border-radius: 8px;
    height: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #48bb78;
    border-radius: 8px;
    transition: width 0.4s;
  }

  .progress-label {
    color: #718096;
    font-size: 0.82rem;
    margin-bottom: 20px;
    text-align: center;
  }

  /* ── Card scene ── */
  .scene {
    width: 100%;
    max-width: 800px;
    perspective: 1200px;
    margin-bottom: 24px;
  }

  .card {
    width: 100%;
    min-height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    min-height: 280px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
  }

  .card-front {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }

  .card-back {
    background: white;
    transform: rotateY(180deg);
    border: 2px solid #e2e8f0;
    color: #2d3748;
  }

  .card-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 12px;
  }

  .card-number {
    font-size: 0.75rem;
    opacity: 0.6;
    margin-bottom: 8px;
  }

  .card-text {
    font-size: 1.05rem;
    line-height: 1.75;
  }

  .card-text em { font-style: italic; }

  .card-hint {
    margin-top: 20px;
    font-size: 0.78rem;
    opacity: 0.65;
    text-align: center;
  }

  .category-tag {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 10px;
    border-radius: 12px;
    margin-bottom: 14px;
    font-weight: 600;
    background: rgba(255,255,255,0.22);
  }

  .card-back .category-tag {
    background: #ebf8ff;
    color: #2b6cb0;
  }

  /* ── Navigation ── */
  .nav {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 16px;
  }

  .btn {
    padding: 10px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-primary { background: #4299e1; color: white; }
  .btn-primary:hover { background: #3182ce; }
  .btn-secondary { background: white; color: #4a5568; border: 2px solid #cbd5e0; }
  .btn-secondary:hover { background: #f7fafc; }
  .btn-success { background: #48bb78; color: white; }
  .btn-success:hover { background: #38a169; }
  .btn-warning { background: #ed8936; color: white; }
  .btn-warning:hover { background: #dd6b20; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Shuffle / known counter ── */
  .stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .stat-known { background: #c6f6d5; color: #276749; }
  .stat-unknown { background: #fed7d7; color: #9b2c2c; }
  .stat-total { background: #bee3f8; color: #2c5282; }

  /* ── Known/Unknown buttons on card ── */
  .mark-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 4px;
  }

  .btn-known { background: #48bb78; color: white; }
  .btn-known:hover { background: #38a169; }
  .btn-unknown { background: #fc8181; color: white; }
  .btn-unknown:hover { background: #e53e3e; }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    color: #718096;
    padding: 48px 0;
    font-size: 1rem;
  }
</style>
</head>
<body>

<h1>分子生物學複習字卡</h1>
<p class="subtitle">點擊卡片翻面查看答案</p>

<div class="filter-bar" id="filterBar"></div>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
</div>
<div class="progress-label" id="progressLabel">載入中…</div>

<div class="stats">
  <div class="stat-pill stat-total" id="statTotal">共 0 題</div>
  <div class="stat-pill stat-known" id="statKnown">✓ 已掌握 0</div>
  <div class="stat-pill stat-unknown" id="statUnknown">✗ 待複習 0</div>
</div>

<div class="scene">
  <div class="card" id="mainCard" onclick="flipCard()">
    <div class="card-face card-front" id="cardFront">
      <div class="card-number" id="cardNumber"></div>
      <div class="category-tag" id="cardCategory"></div>
      <div class="card-label">問題</div>
      <div class="card-text" id="cardQuestion"></div>
      <div class="card-hint">點擊翻面查看答案 ▼</div>
    </div>
    <div class="card-face card-back" id="cardBack">
      <div class="category-tag" id="cardCategoryBack"></div>
      <div class="card-label">參考答案</div>
      <div class="card-text" id="cardAnswer"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="btn btn-secondary" onclick="prevCard()">← 上一題</button>
  <button class="btn btn-primary" onclick="flipCard()">翻面</button>
  <button class="btn btn-secondary" onclick="nextCard()">下一題 →</button>
</div>

<div class="mark-btns">
  <button class="btn btn-known" onclick="markCard(true)">✓ 已掌握</button>
  <button class="btn btn-unknown" onclick="markCard(false)">✗ 再複習</button>
  <button class="btn btn-secondary" onclick="shuffleCards()">🔀 隨機排序</button>
  <button class="btn btn-warning" onclick="filterUnknown()">只看未掌握</button>
  <button class="btn btn-secondary" onclick="resetAll()">重置全部</button>
</div>

<script>
const ALL_CARDS = [
  // ── 類別一：DNA 複製機制 ──
  {
    category: "DNA 複製機制",
    question: "某些病毒（如腺病毒）為了避免落後鏈（lagging-strand）合成的問題，會同時從兩端以領先鏈（leading-strand）的方向分別複製 DNA 的個別單鏈，最終完成整個分子的複製。為什麼細菌染色體不採取這種方式複製？",
    answer: "細菌 DNA 的兩條鏈可能不以這種方式同時進行 3' 到 5' 方向的複製，是因為要複製像染色體這麼長的 DNA，這種方式會留下極長的單鏈區域，這些區域會非常不穩定或容易受到核酸酶（nucleases）的攻擊。"
  },
  {
    category: "DNA 複製機制",
    question: "為什麼 DNA 分子這麼長？擁有多個較短的 DNA 片段不是比較容易嗎？單一長 DNA 分子的優缺點為何？",
    answer: "DNA 分子之所以非常長，可能是因為如果細胞包含許多短片段 DNA，在細胞分裂時，每一個片段都必須單獨且精確地分配（segregated）到子細胞中，這會增加分配的複雜度。"
  },
  {
    category: "DNA 複製機制",
    question: "為什麼細胞以 DNA 而非像某些病毒一樣以 RNA 作為遺傳物質？",
    answer: "細胞之所以以 DNA 而非 RNA 作為遺傳物質，不只是因為 DNA 較穩定，也因為雙股 DNA 的 B-form helix 結構較規則，適合高精準度的 replication 與 repair。DNA replication 又仰賴 RNA primer 起始，因為最終遺傳物質是 DNA，所以這些 RNA 區段可被辨認為臨時成分並移除，再由高保真的 DNA polymerase 以鄰近 DNA 的 3' 端為起點補回。這樣可以避免起始區域留下較難校對的錯誤，進而提高整體 genome 複製的正確性。"
  },
  {
    category: "DNA 複製機制",
    question: "對於 dnaA 基因（編碼啟始蛋白 DnaA）發生溫度敏感突變的菌株，將其轉移到高溫（非許可溫度）對 DNA 合成速率有何影響？速率會呈線性還是指數下降？曲線斜率是否會受到轉移時細胞生長速率的影響？請解釋。",
    answer: "溫度轉移會導致 DNA 合成速率下降，但不會過於突然。每個細胞會完成在轉移時已經開始的複製輪次，但不會開啟新的一輪。合成速率會呈指數下降。如果細胞生長迅速，下降的斜率會較緩，因為每個分子中已有數個複製輪次正在進行，且每個輪次都必須完成。"
  },
  {
    category: "DNA 複製機制",
    question: "迴旋酶（gyrase）抑制劑 novobiocin 會抑制幾乎所有類型的細菌生長。對於產生這種抗生素的細菌 Streptomyces sphaeroides，你對其迴旋酶有何預測？你會如何測試你的假設？",
    answer: "Streptomyces sphaeroides 的迴旋酶可能天生就對 novobiocin 具備抗性。你可以純化該迴旋酶，並在體外（in vitro）存在 novobiocin 的情況下，測試其在 DNA 中引入超螺旋的能力。"
  },
  {
    category: "DNA 複製機制",
    question: "你認為在大腸桿菌（E. coli）這類細菌中，染色體複製與細胞分裂是如何協調的？你會如何測試你的假設？",
    answer: "目前尚不完全清楚這兩者如何協調。一個假設是：細胞分裂所需的蛋白質可能由位於終止區域（termination region）附近的基因編碼，且該基因僅在該區域複製時才轉錄。因此，細胞分裂僅能在終止區域複製後開始。測試方法可以嘗試將複製終止位點移動到染色體的其他位置，觀察是否會影響細胞分裂的時機。"
  },
  {
    category: "DNA 複製機制",
    question: "為什麼染色體複製的終止機制如此「鬆散」，以至於 ter 區域對生長而言並非必要，且每個方向都需要多個 ter 位點才能完全停止複製叉？染色體上沒有一個絕對的終止點有什麼優點？",
    answer: "目前尚無確切答案，但這可能允許更多的基因組重組（如倒位或重複），這在進化中扮演重要角色。如果複製必須在特定序列停止，重組可能會導致整個 DNA 無法完成複製。允許部分「讀過」（readthrough）現象可以讓少數細胞在基因重排後存活，進而找到更有效的基因排列。"
  },

  // ── 類別二：PCR 與分子工具 ──
  {
    category: "PCR 與分子工具",
    question: "你正以 5'ACCTTACCGTAATCC3' 為模板並利用上游引子合成 DNA。你在反應混合物中加入了三種去氧核苷三磷酸，但漏掉了第四種——去氧胞嘧啶三磷酸（dCTP）。你會合成出什麼樣的 DNA？",
    answer: "5'GGATTA3'（記得 5'→3'，遇到 template 上的 G 就停止，因為缺少 dCTP 無法配對 G）"
  },
  {
    category: "PCR 與分子工具",
    question: "利用相同的模板與上游引子合成 DNA，但這次除了加入其他三種 dNTPs 外，你加入的是等量的複製抑制劑 dideoxythymidine triphosphate (ddTTP) 與正常的去氧胸苷三磷酸 (dTTP) 混合物。你會合成出哪些 DNA？",
    answer: "找出哪些位置本來要加 T，那些位置都可能提早停下來。會產生四種長度不一的片段：5'GGAddT3'、5'GGATddT3'、5'GGATTACCGGddT3'、5'GGATTACCGGTAAGAddT3'"
  },
  {
    category: "PCR 與分子工具",
    question: "請設計一個下游 PCR 引子（downstream PCR primer），用以擴增序列 5'CGATCTTAAT3' 上游的序列，並加入一個 EcoRI 限制酶位點以便進行選殖。",
    answer: "5'NNGAATTCATTAAGATCG3'（N 代表任何去氧核苷酸）。互補後反向配對得 5'ATTAAGATCG3'，EcoRI 辨識序列 5'GAATTC3' 加到 5' 端，末端加 NN 保護鹼基，優先使用 G/C 減少末端 fraying。"
  },
  {
    category: "PCR 與分子工具",
    question: "請設計 PCR 引子以引入 Eam1104I 位點，從而將選殖載體上以 5'...GCGACGTACGA3' 結尾的序列，與插入片段上以 5'TACGAAGCTCT3' 開頭的序列進行無縫銜接。",
    answer: "載體引子：5'NNCTCTTCGTACGTCGC3'；插入片段引子：5'NNCTCTTCTACGAAGCTCT3'。NN 為保護鹼基，CTCTTC 為 Eam1104I 識別位點，後接各自端點序列的反向互補或正向序列。"
  },
  {
    category: "PCR 與分子工具",
    question: "請設計一個 20 個核苷酸的 PCR 引子（upstream primer），藉此引入 BamHI 限制酶位點，以便將起始序列為 ATGUUGCGATTU 的蛋白質編碼序列，選殖到 His-tag 載體下游（載體上的轉譯起始序列末端含有 GGATCCT）。",
    answer: "建議使用 5'CCGGATCCATGTTGCGATTT3'。5' 端加 CC 幫助 BamHI 有效切割；GGATCC 為 BamHI 位點；後接 insert 起始序列 ATGTTGCGATTT，維持與 His-tag 的 reading frame。"
  },
  {
    category: "PCR 與分子工具",
    question: "請概述如何利用 PCR、選殖以及親和標籤（affinity tag）融合技術，來純化一個功能未知但序列已知的編碼蛋白。",
    answer: "通常建議從 cDNA 進行 PCR 擴增，以避免真核基因中內含子的干擾。需利用反轉錄酶合成 cDNA，並設計引子在 5' 端加入限制酶位點，以便與載體上的 His-tag 進行閱讀框融合。將載體轉入 E. coli 並誘導表現後，利用親和層析管柱純化融合蛋白，最後可利用序列專一性蛋白酶將標籤切除。"
  },

  // ── 類別三：細胞週期與拓撲酶 ──
  {
    category: "細胞週期與拓撲酶",
    question: "你正在培養一代時間（generation time）僅為 25 分鐘的 E. coli。其 I period、C period 與 D period 分別會是多長？",
    answer: "I = 25 min, C = 40 min, D = 20 min。I period = inter-initiation period = generation time。因為 25 min 遠小於 C + D = 60 min，所以發生 multifork replication（重疊複製輪次）。"
  },
  {
    category: "細胞週期與拓撲酶",
    question: "你正在培養一代時間為 90 分鐘的 E. coli。其 I、C 與 D periods 分別會是多長？",
    answer: "I = 90 min, C = 40 min, D = 20 min。因為 generation time（90 min）> C + D（60 min），每個複製輪次在下一輪開始前便已完成，不需 multifork replication。"
  },
  {
    category: "細胞週期與拓撲酶",
    question: "你正在測量來自 E. coli topA mutant（缺少主要的 type I topoisomerase）的質體超螺旋狀態，並與無突變的 E. coli 質體進行比較。你預期突變株的質體中會有較多還是較少的負超螺旋 (negative supercoils)？為什麼？",
    answer: "預期突變株中會有較多的負超螺旋。因為 topA 突變株缺少 topoisomerase I（該酵素的功能是移除負超螺旋），所以在突變株的 DNA 中會累積更多的負超螺旋。"
  },

  // ── 類別四：轉譯與遺傳密碼 ──
  {
    category: "轉譯與遺傳密碼",
    question: "你認為在地球最早期的生命中，最先出現的是 DNA、RNA 還是蛋白質？為什麼？",
    answer: "有些人認為 RNA 最先出現，因為負責連接胺基酸以製造蛋白質的肽醯轉移酶（peptidyl-transferase）其實是 23S rRNA，且其他一些酶也是由 RNA 組成的。然而，這個問題目前仍處於推測階段。"
  },
  {
    category: "轉譯與遺傳密碼",
    question: "為什麼遺傳密碼（Genetic code）是通用的？",
    answer: "遺傳密碼之所以通用，可能是因為一旦這套密碼體系建立起來，涉及轉譯密碼的組件（如胺基醯-tRNA 合成酶等）實在太多了，導致無法在不破壞系統的情況下更改其中任何一部分。"
  },
  {
    category: "轉譯與遺傳密碼",
    question: "為什麼你認為原核生物擁有多順反子 mRNA（polycistronic mRNAs），而真核生物卻沒有？",
    answer: "真核生物極少擁有包含多個編碼區 mRNA 的原因仍待推測。這可能與 mRNA 在轉譯前必須先從細胞核輸出到細胞質的必要性有關。"
  },
  {
    category: "轉譯與遺傳密碼",
    question: "為什麼你認為粒線體基因的遺傳密碼與染色體基因有所不同？",
    answer: "這是因為粒線體曾是擁有自己簡單轉譯設備（如核糖體等）的細菌。這套轉譯系統一直與染色體基因的轉譯系統保持獨立運作，因此它們各自演化出了不同的路徑。"
  },
  {

    answer: "這個 intergenic suppressor mutation 應位於靠近 argG gene 的位置。因為 80% 的 Arg+ recombinants 同時變成 His−，代表 donor 在提供 argG+ 時，常常也一起帶入 suppressor locus 的野生型 allele，取代受體原本的 suppressor mutation，使 his nonsense mutation 不再被抑制。"

// State
let cards = [...ALL_CARDS];
let currentIndex = 0;
let isFlipped = false;
let known = new Set();
let unknown = new Set();
let activeCategory = "全部";

// Get all unique categories
const categories = ["全部", ...new Set(ALL_CARDS.map(c => c.category))];

function buildFilterBar() {
  const bar = document.getElementById("filterBar");
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => setCategory(cat);
    bar.appendChild(btn);
  });
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll(".filter-btn").forEach((b, i) => {
    b.classList.toggle("active", categories[i] === cat);
  });
  filterCards();
}

function filterCards() {
  if (activeCategory === "全部") {
    cards = [...ALL_CARDS];
  } else {
    cards = ALL_CARDS.filter(c => c.category === activeCategory);
  }
  currentIndex = 0;
  isFlipped = false;
  document.getElementById("mainCard").classList.remove("flipped");
  render();
}

function filterUnknown() {
  cards = ALL_CARDS.filter(c => unknown.has(ALL_CARDS.indexOf(c)) || (!known.has(ALL_CARDS.indexOf(c)) && !unknown.has(ALL_CARDS.indexOf(c))));
  if (cards.length === 0) {
    alert("太棒了！沒有標記「再複習」的題目囉。");
    cards = [...ALL_CARDS];
  }
  currentIndex = 0;
  isFlipped = false;
  document.getElementById("mainCard").classList.remove("flipped");
  render();
}

function render() {
  if (cards.length === 0) {
    document.getElementById("cardQuestion").innerHTML = "沒有符合條件的題目";
    document.getElementById("cardAnswer").innerHTML = "";
    return;
  }

  const card = cards[currentIndex];
  const globalIdx = ALL_CARDS.indexOf(card);

  document.getElementById("cardNumber").textContent = `第 ${currentIndex + 1} 題 / 共 ${cards.length} 題`;
  document.getElementById("cardCategory").textContent = card.category;
  document.getElementById("cardCategoryBack").textContent = card.category;
  document.getElementById("cardQuestion").innerHTML = escapeHtml(card.question).replace(/\n/g, "<br>");
  document.getElementById("cardAnswer").innerHTML = escapeHtml(card.answer).replace(/\n/g, "<br>");

  // Progress (based on known)
  const pct = ALL_CARDS.length > 0 ? Math.round(known.size / ALL_CARDS.length * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `已掌握進度 ${pct}%（${known.size} / ${ALL_CARDS.length} 題）`;

  // Stats
  document.getElementById("statTotal").textContent = `共 ${ALL_CARDS.length} 題`;
  document.getElementById("statKnown").textContent = `✓ 已掌握 ${known.size}`;
  document.getElementById("statUnknown").textContent = `✗ 待複習 ${unknown.size}`;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById("mainCard").classList.toggle("flipped", isFlipped);
}

function nextCard() {
  if (currentIndex < cards.length - 1) {
    currentIndex++;
    isFlipped = false;
    document.getElementById("mainCard").classList.remove("flipped");
    render();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    isFlipped = false;
    document.getElementById("mainCard").classList.remove("flipped");
    render();
  }
}

function markCard(isKnown) {
  const card = cards[currentIndex];
  const globalIdx = ALL_CARDS.indexOf(card);
  if (isKnown) {
    known.add(globalIdx);
    unknown.delete(globalIdx);
  } else {
    unknown.add(globalIdx);
    known.delete(globalIdx);
  }
  render();
  if (currentIndex < cards.length - 1) nextCard();
}

function shuffleCards() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  currentIndex = 0;
  isFlipped = false;
  document.getElementById("mainCard").classList.remove("flipped");
  render();
}

function resetAll() {
  known.clear();
  unknown.clear();
  cards = [...ALL_CARDS];
  currentIndex = 0;
  isFlipped = false;
  activeCategory = "全部";
  document.querySelectorAll(".filter-btn").forEach((b, i) => {
    b.classList.toggle("active", i === 0);
  });
  document.getElementById("mainCard").classList.remove("flipped");
  render();
}

// Keyboard navigation
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") nextCard();
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") prevCard();
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
  else if (e.key === "k" || e.key === "K") markCard(true);
  else if (e.key === "u" || e.key === "U") markCard(false);
});

buildFilterBar();
render();
</script>
</body>
</html>
